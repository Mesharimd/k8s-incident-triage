apiVersion: v1
kind: Namespace
metadata:
  name: k8s-incident-triage
  labels:
    app.kubernetes.io/name: k8s-incident-triage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-incident-triage
  namespace: k8s-incident-triage
  labels:
    app.kubernetes.io/name: k8s-incident-triage
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-incident-triage-readonly
  labels:
    app.kubernetes.io/name: k8s-incident-triage
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-incident-triage-readonly
  labels:
    app.kubernetes.io/name: k8s-incident-triage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-incident-triage-readonly
subjects:
  - kind: ServiceAccount
    name: k8s-incident-triage
    namespace: k8s-incident-triage
