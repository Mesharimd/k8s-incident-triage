apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-triage-demo-oom
  namespace: k8s-incident-triage-demo
  labels:
    app.kubernetes.io/name: k8s-triage-demo-oom
    app.kubernetes.io/part-of: k8s-incident-triage-demo
    incident-triage.meshari.dev/scenario: oom
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-triage-demo-oom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-triage-demo-oom
        app.kubernetes.io/part-of: k8s-incident-triage-demo
        incident-triage.meshari.dev/scenario: oom
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memory-hog
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              payload=x
              while true; do
                payload="${payload}${payload}"
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
              ephemeral-storage: 4Mi
            limits:
              cpu: 50m
              memory: 24Mi
              ephemeral-storage: 8Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8s-triage-demo-oom
  namespace: k8s-incident-triage-demo
  labels:
    app.kubernetes.io/name: k8s-triage-demo-oom
    app.kubernetes.io/part-of: k8s-incident-triage-demo
    incident-triage.meshari.dev/scenario: oom
    # Live prerequisite: Prometheus must select this namespace and release label.
    release: kube-prometheus-stack
spec:
  groups:
    - name: k8s-incident-triage-demo-oom
      rules:
        - alert: K8sIncidentDemoOOMKilled
          expr: |
            max by (namespace, pod, container) (
              kube_pod_container_status_last_terminated_reason{
                namespace="k8s-incident-triage-demo",
                pod=~"k8s-triage-demo-oom-.*",
                container="memory-hog",
                reason="OOMKilled"
              }
            ) == 1
          for: 30s
          labels:
            severity: "critical"
            demo: "true"
            scenario: "oom"
          annotations:
            summary: "Demo container was OOMKilled"
            description: "A deliberately memory-constrained demo container exceeded its 24Mi limit. Human review is required; no remediation is automatic."
