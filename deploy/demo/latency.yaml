apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-triage-demo-latency
  namespace: k8s-incident-triage-demo
  labels:
    app.kubernetes.io/name: k8s-triage-demo-latency
    app.kubernetes.io/part-of: k8s-incident-triage-demo
    incident-triage.meshari.dev/scenario: latency
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-triage-demo-latency
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-triage-demo-latency
        app.kubernetes.io/part-of: k8s-incident-triage-demo
        incident-triage.meshari.dev/scenario: latency
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 0
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cpu-hog
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - "while true; do :; done"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
              ephemeral-storage: 4Mi
            limits:
              cpu: 10m
              memory: 24Mi
              ephemeral-storage: 8Mi
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8s-triage-demo-latency
  namespace: k8s-incident-triage-demo
  labels:
    app.kubernetes.io/name: k8s-triage-demo-latency
    app.kubernetes.io/part-of: k8s-incident-triage-demo
    incident-triage.meshari.dev/scenario: latency
    # Live prerequisite: Prometheus must select this namespace and release label.
    release: kube-prometheus-stack
spec:
  groups:
    - name: k8s-incident-triage-demo-latency
      rules:
        - alert: K8sIncidentDemoCPUStarvation
          expr: |
            sum by (namespace, pod, container) (
              rate(container_cpu_cfs_throttled_periods_total{
                namespace="k8s-incident-triage-demo",
                pod=~"k8s-triage-demo-latency-.*",
                container="cpu-hog"
              }[1m])
            )
            /
            clamp_min(
              sum by (namespace, pod, container) (
                rate(container_cpu_cfs_periods_total{
                  namespace="k8s-incident-triage-demo",
                  pod=~"k8s-triage-demo-latency-.*",
                  container="cpu-hog"
                }[1m])
              ),
              0.001
            ) > 0.5
          for: 30s
          labels:
            severity: "warning"
            demo: "true"
            scenario: "latency"
          annotations:
            summary: "Demo workload is CPU starved"
            description: "The demo's busy loop is constrained to 10m CPU and more than half its scheduling periods are throttled, simulating latency from CPU starvation. Human review is required; no remediation is automatic."
