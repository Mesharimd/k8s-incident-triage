{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "k8s-incident-triage.fullname" . }}
  labels:
    {{- include "k8s-incident-triage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "k8s-incident-triage.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.alertmanagerNamespaceSelector | nindent 12 }}
          {{- with .Values.networkPolicy.alertmanagerPodSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.config.port }}
{{- end }}
