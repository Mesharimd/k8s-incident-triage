{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-incident-triage.clusterRoleName" . }}
  labels:
    {{- include "k8s-incident-triage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-incident-triage.clusterRoleName" . }}
  labels:
    {{- include "k8s-incident-triage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-incident-triage.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-incident-triage.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
