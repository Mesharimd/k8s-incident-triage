{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must remain 1 because incident dedupe is process-local" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-incident-triage.fullname" . }}
  labels:
    {{- include "k8s-incident-triage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    # Dedupe state is process-local, so overlapping replicas could redeliver alerts.
    type: Recreate
  selector:
    matchLabels:
      {{- include "k8s-incident-triage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "k8s-incident-triage.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "k8s-incident-triage.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: triage
          image: {{ include "k8s-incident-triage.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "k8s-incident-triage.fullname" . }}
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-incident-triage.secretName" . }}
                  key: {{ .Values.secrets.anthropicApiKeyKey }}
                  optional: false
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-incident-triage.secretName" . }}
                  key: {{ .Values.secrets.telegramBotTokenKey }}
                  optional: false
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-incident-triage.secretName" . }}
                  key: {{ .Values.secrets.telegramChatIdKey }}
                  optional: false
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: traces
              mountPath: /var/lib/k8s-incident-triage/traces
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: traces
          emptyDir:
            sizeLimit: {{ required "storage.traces.sizeLimit must be a finite Kubernetes quantity" .Values.storage.traces.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ required "storage.tmp.sizeLimit must be a finite Kubernetes quantity" .Values.storage.tmp.sizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
