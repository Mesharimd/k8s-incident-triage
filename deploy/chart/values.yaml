replicaCount: 1

image:
  repository: ghcr.io/mesharimd/k8s-incident-triage
  pullPolicy: Always
  tag: latest
  # A digest takes precedence over tag. Pin it in production GitOps values.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: k8s-incident-triage

serviceAccount:
  # This name and the read-only role below mirror deploy/rbac.yaml.
  create: true
  name: k8s-incident-triage
  annotations: {}

rbac:
  # The chart-managed ClusterRole grants get/list only.
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  annotations: {}

container:
  port: 3000

environment:
  # The operator creates this Secret through the cluster's Sealed Secrets flow.
  # Every key is imported as an environment variable; this chart never renders
  # a Secret or a secret value.
  existingSecret: triage-env

prometheus:
  # This cluster-owned endpoint deliberately overrides any same-named key in
  # triage-env so the read-only tools cannot be redirected by app credentials.
  url: http://prometheus-operated.monitoring.svc:9090

networkPolicy:
  enabled: true
  # Restrict webhook ingress to the namespace that runs Alertmanager. Narrow
  # podSelector too after inspecting the live operator-managed Pod labels.
  alertmanagerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: monitoring
  alertmanagerPodSelector: {}

probes:
  startup:
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30
  readiness:
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

# The runbook's production environment bounds active work to 75s triage + 40s
# Telegram delivery. Shutdown stops admission, cancels pending work, and lets
# active work settle within this grace.
terminationGracePeriodSeconds: 120

resources:
  requests:
    cpu: 50m
    memory: 128Mi
    ephemeral-storage: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 256Mi

storage:
  # Both paths are ephemeral and are discarded when the Pod is replaced.
  traces:
    sizeLimit: 128Mi
  tmp:
    sizeLimit: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}

alertmanagerConfig:
  # Creates a Prometheus Operator AlertmanagerConfig when its CRD is installed.
  enabled: false
  # Required when enabled. Supported values are OnNamespace and Global.
  # Global is valid only after the cluster-owned Alertmanager is verified to
  # use spec.alertmanagerConfigMatcherStrategy.type=None.
  scope: ""
  # With scope=OnNamespace, this is required and must be the target workload
  # namespace carried by the alerts, not merely the Alertmanager namespace.
  # With scope=Global, empty installs the config in the Helm release namespace.
  namespace: ""
  labels: {}
  # Empty targets the chart Service using its cluster-local DNS name.
  webhookUrl: ""
  route:
    groupBy:
      - alertname
      - namespace
      - pod
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 5m
    # With scope=OnNamespace, the chart owns the exact namespace matcher.
    matchers: []
